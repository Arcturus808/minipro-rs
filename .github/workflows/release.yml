name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  verify-versions:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version consistency across all files and tag
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"

          echo "Tag: $TAG"
          echo "Expected version: $TAG_VERSION"
          echo ""

          # Extract version from each file
          CARGO_ROOT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CARGO_GUI=$(grep '^version' gui/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAURI_CONF=$(grep '"version"' gui/src-tauri/tauri.conf.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PKG_JSON=$(grep '"version"' gui/package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')

          echo "Cargo.toml (root):     $CARGO_ROOT"
          echo "gui/src-tauri Cargo:   $CARGO_GUI"
          echo "tauri.conf.json:       $TAURI_CONF"
          echo "package.json:          $PKG_JSON"
          echo ""

          ERRORS=0

          if [ "$CARGO_ROOT" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.toml (root) version '$CARGO_ROOT' does not match tag '$TAG_VERSION'"
            ERRORS=$((ERRORS + 1))
          fi
          if [ "$CARGO_GUI" != "$TAG_VERSION" ]; then
            echo "::error::gui/src-tauri/Cargo.toml version '$CARGO_GUI' does not match tag '$TAG_VERSION'"
            ERRORS=$((ERRORS + 1))
          fi
          if [ "$TAURI_CONF" != "$TAG_VERSION" ]; then
            echo "::error::tauri.conf.json version '$TAURI_CONF' does not match tag '$TAG_VERSION'"
            ERRORS=$((ERRORS + 1))
          fi
          if [ "$PKG_JSON" != "$TAG_VERSION" ]; then
            echo "::error::package.json version '$PKG_JSON' does not match tag '$TAG_VERSION'"
            ERRORS=$((ERRORS + 1))
          fi

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "::error::$ERRORS file(s) have version mismatch. Bump all four version fields before tagging."
            exit 1
          fi

          echo "All versions match tag $TAG_VERSION."

  build:
    needs: verify-versions
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
            cli_name: 'minipro-cli-macos-aarch64'
            tui_name: 'minipro-tui-macos-aarch64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
            cli_name: 'minipro-cli-linux-x86_64'
            tui_name: 'minipro-tui-linux-x86_64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
            cli_name: 'minipro-cli-windows-x86_64.exe'
            tui_name: 'minipro-tui-windows-x86_64.exe'
            pkg_name: 'minipro-cli-tui-windows-x86_64.zip'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            squashfs-tools

      - name: Build CLI + TUI
        run: cargo build --release --locked --bin minipro --bin minipro-tui ${{ matrix.args }}

      - name: Strip and stage CLI tarball (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          if [ -n "${{ matrix.args }}" ]; then
            BIN="target/${{ matrix.target }}/release/minipro"
            TUI="target/${{ matrix.target }}/release/minipro-tui"
          else
            BIN="target/release/minipro"
            TUI="target/release/minipro-tui"
          fi
          strip "$BIN" "$TUI"
          PKGDIR="${{ matrix.cli_name }}"
          mkdir -p "$PKGDIR/man/man1" "$PKGDIR/completions"
          cp "$BIN" "$PKGDIR/minipro"
          cp "$TUI" "$PKGDIR/minipro-tui"
          # XMLs beside the binaries → resolver's exe-dir search finds them;
          # the tarball is self-contained. algorithm.xml stays out (IP).
          cp data/infoic.xml data/logicic.xml "$PKGDIR/"
          "$BIN" --generate-man | gzip -9 > "$PKGDIR/man/man1/minipro.1.gz"
          "$BIN" --generate-completions bash > "$PKGDIR/completions/minipro.bash"
          "$BIN" --generate-completions zsh  > "$PKGDIR/completions/_minipro"
          "$BIN" --generate-completions fish > "$PKGDIR/completions/minipro.fish"
          tar -czf "${{ matrix.cli_name }}.tar.gz" "$PKGDIR"

      - name: Strip and stage binaries (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          copy target\release\minipro.exe ${{ matrix.cli_name }}
          copy target\release\minipro-tui.exe ${{ matrix.tui_name }}
          # Self-contained zip: exes + XMLs in one dir → exe-dir resolver hit.
          # Loose exes stay as assets too (existing links/bookmarks).
          mkdir minipro-cli-tui-windows-x86_64
          copy target\release\minipro.exe minipro-cli-tui-windows-x86_64\
          copy target\release\minipro-tui.exe minipro-cli-tui-windows-x86_64\
          copy data\infoic.xml minipro-cli-tui-windows-x86_64\
          copy data\logicic.xml minipro-cli-tui-windows-x86_64\
          Compress-Archive -Path minipro-cli-tui-windows-x86_64 -DestinationPath ${{ matrix.pkg_name }}

      - name: Install frontend dependencies
        working-directory: ./gui
        run: npm install

      - name: Build and release GUI
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './gui'
          tagName: ${{ github.ref_name }}
          releaseName: 'MINIPRO-RS ${{ github.ref_name }}'
          # Placeholder only — the "Update release body" step overwrites this
          # with notes from scripts/release-notes.sh once uploads finish.
          releaseBody: |
            Draft release — notes are assembled from CHANGELOG.md once all binaries are uploaded.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Check + fix AppImage file permissions (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # tauri-bundler has shipped owner-limited entries inside the
          # AppImage (AppRun.wrapped 0700 — tauri#16155, fixed in 2.12).
          # Stored squashfs modes govern other-uid mounts (firejail, the
          # AppImage catalog test); normal users are unaffected since their
          # uid owns the FUSE mount. Inspect STORED inode modes — extraction
          # applies the local umask and can misreport.
          APPIMAGE=$(ls gui/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          OFFSET=$("$APPIMAGE" --appimage-offset)
          BAD=$(unsquashfs -lln -o "$OFFSET" "$APPIMAGE" | grep -cE '^[-dl][-rwx]{6}--- ' || true)
          if [ "$BAD" -eq 0 ]; then
            echo "AppImage permissions OK (no owner-limited entries)"
            exit 0
          fi
          echo "::warning::$BAD owner-limited entries in AppImage — repacking with normalized modes"
          unsquashfs -lln -o "$OFFSET" "$APPIMAGE" | grep -E '^[-dl][-rwx]{6}--- ' | head
          WORK=/tmp/appimage-perm-fix
          rm -rf "$WORK" && mkdir "$WORK"
          unsquashfs -d "$WORK/squashfs-root" -o "$OFFSET" -f "$APPIMAGE" >/dev/null
          chmod -R a+rX "$WORK/squashfs-root"
          curl -fsSL -o "$WORK/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$WORK/appimagetool"
          ARCH=x86_64 "$WORK/appimagetool" "$WORK/squashfs-root" "$APPIMAGE"
          gh release upload "${{ github.ref_name }}" "$APPIMAGE" --clobber
          echo "::warning::Repacked and re-uploaded $(basename "$APPIMAGE")"

      - name: Upload CLI + TUI binaries to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            gh release upload ${{ github.ref_name }} "${{ matrix.cli_name }}" "${{ matrix.tui_name }}" "${{ matrix.pkg_name }}" --clobber
          else
            gh release upload ${{ github.ref_name }} "${{ matrix.cli_name }}.tar.gz" --clobber
          fi

      - name: Update release body from CHANGELOG (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release notes: shared footer lives in scripts/release-notes.sh so
          # the two forges can't drift.
          sh scripts/release-notes.sh "${{ github.ref_name }}" github > /tmp/release_notes.md
          gh release edit "${{ github.ref_name }}" --notes-file /tmp/release_notes.md
