[package]
name    = "minipro-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nusb        = "0.1"
quick-xml   = "0.41"
thiserror   = "2"
log         = "0.4"
crc         = "3"
pollster    = "0.3"
flate2      = "1"
base64      = "0.22"
futures     = "0.3"
serde       = { workspace = true, features = ["derive"] }
ureq = { version = "3", features = ["platform-verifier", "socks-proxy", "win-system-proxy"] }
sha2 = "0.10"
rar-codec = "0.1"
libarchive-rs = { path = "../libarchive-rs" }

[dev-dependencies]
serde_json.workspace = true

[[test]]
name    = "integration"
path    = "../../tests/integration/main.rs"
