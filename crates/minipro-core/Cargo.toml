[package]
name    = "minipro-core"
version = "0.13.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core library for talking to XGecu/MiniPro TL866-family USB chip programmers — device database, protocols, and read/write/verify operations"
readme    = "README.md"
keywords  = ["minipro", "tl866", "eeprom", "programmer", "chip"]
categories = ["hardware-support"]
repository.workspace = true

[dependencies]
nusb        = "0.1"
quick-xml   = "0.41"
thiserror   = "2"
log         = "0.4"
crc         = "3"
pollster    = "0.3"
flate2      = "1"
base64      = "0.22"
futures     = "0.3"
serde       = { workspace = true, features = ["derive"] }
ureq = { version = "3", features = ["platform-verifier", "socks-proxy", "win-system-proxy"] }
sha2 = "0.10"
rar-codec = "0.1"
rar4 = { path = "../rar4", version = "0.1" }

[dev-dependencies]
serde_json.workspace = true

[[test]]
name    = "integration"
path    = "../../tests/integration/main.rs"
